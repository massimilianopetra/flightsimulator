<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b56a0"/><stop offset="1" stop-color="#62a8e2"/>
    </linearGradient>
    <linearGradient id="terra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5a2b"/><stop offset="1" stop-color="#4f3016"/>
    </linearGradient>
    <clipPath id="bordo"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#bordo)">
    <!-- orizzonte artificiale inclinato -->
    <g transform="rotate(-16 32 32)">
      <rect x="-24" y="-24" width="112" height="64" fill="url(#cielo)"/>
      <rect x="-24" y="40" width="112" height="50" fill="url(#terra)"/>
      <rect x="-24" y="39" width="112" height="2.2" fill="#ffffff"/>
    </g>
    <!-- Cessna visto dall'alto -->
    <g stroke="#0b1322" stroke-width="1.6" stroke-linejoin="round" paint-order="stroke">
      <rect x="5" y="19" width="54" height="8" rx="3" fill="#ffffff"/>
      <rect x="21" y="47" width="22" height="5.5" rx="2.2" fill="#ffffff"/>
      <rect x="28.8" y="9" width="6.4" height="46" rx="3.2" fill="#ffffff"/>
    </g>
    <rect x="5.8" y="19.8" width="4.5" height="6.4" rx="2" fill="#d0342c"/>
    <rect x="53.7" y="19.8" width="4.5" height="6.4" rx="2" fill="#d0342c"/>
    <rect x="30.4" y="20" width="3.2" height="7" rx="1.2" fill="#1d3f78"/>
    <rect x="24" y="5.6" width="16" height="2.4" rx="1.2" fill="#0b1322"/>
  </g>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.3" fill="none" stroke="#0b1322" stroke-opacity=".35" stroke-width="1.5"/>
</svg>
